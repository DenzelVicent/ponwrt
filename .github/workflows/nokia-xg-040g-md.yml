name: nokia-xg-040g-md PonWrt

on:
  # 手动触发入口,无需填参数;Release tag 由发布步骤按当天北京日期自动生成
  # (dev-YYYYMMDD)。若要改为每天定时自动构建,可在此追加:
  #   schedule:
  #     - cron: "0 21 * * *"   # UTC 21:00 = 北京时间 05:00
  workflow_dispatch:

permissions:
  contents: read

# 同一时刻只允许一条本型号的发布流水线;后触发的排队等待而非中断已运行的构建
concurrency:
  group: release-nokia-xg-040g-md
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: release
    strategy:
      fail-fast: false
      matrix:
        target:
          - nokia-xg-040g-md

    steps:
      - uses: actions/checkout@v6

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-${{ matrix.target }}-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-${{ matrix.target }}-

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load repository signing key
        env:
          PONWRT_APK_PRIVATE_KEY: ${{ secrets.PONWRT_APK_PRIVATE_KEY }}
        run: |
          if [ -n "$PONWRT_APK_PRIVATE_KEY" ]; then
            umask 077
            printf '%s\n' "$PONWRT_APK_PRIVATE_KEY" > private-key.pem
            openssl ec -in private-key.pem -pubout -out public-key.pem
          fi

      - name: Configure ${{ matrix.target }}
        run: |
          ./scripts/kconfig.pl + \
            "configs/${{ matrix.target }}.config" \
            configs/release.config > .config
          make defconfig

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Build ${{ matrix.target }}
        run: make -j"$(nproc)"

      # 只收集真正的固件镜像文件(.itb/.img/.ubi/.bin),平铺进 release/ 直接发布,
      # 用户下载即刷,不再打 tar.zst。递归遍历整个 bin/targets/airoha 是刻意的:
      # OpenWrt 产物目录按 subtarget 命名(an7581),多 profile 时镜像还会再按
      # 设备分子目录,目录名与 matrix.target(型号名)并不一致,写死目录名会报
      # "Cannot stat";用 find 兼容两种布局,增删设备 profile 也无需改本步骤。
      # 每个 profile 目录下文件名相同(如 sysupgrade.itb),直接 cp -t 会互相覆盖,
      # 故拷贝时以父目录名(profile 名)作前缀重命名。
      # 自动排除 packages/ 软件包仓库、config.seed、.buildinfo 等无关产物
      - name: Collect ${{ matrix.target }} firmware
        run: |
          mkdir release
          found=0
          while IFS= read -r f; do
            cp "$f" "release/$(basename "$(dirname "$f")")-$(basename "$f")"
            found=1
          done < <(find bin/targets/airoha -type f \
                     \( -name '*.itb' -o -name '*.img' -o -name '*.ubi' -o -name '*.bin' \) \
                     -not -path '*/packages/*')
          test "$found" = 1 || { echo "no firmware images found"; exit 1; }

      - name: Upload ${{ matrix.target }}
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download firmware files
        uses: actions/download-artifact@v4
        with:
          pattern: ponwrt-*
          path: release
          merge-multiple: true

      # 对 release/ 内所有固件文件生成 sha256 校验(排除校验文件自身),
      # 刷写前可用它核对完整性;用 find 而非通配符,避免某类扩展名不存在时报错
      - name: Create checksums
        working-directory: release
        run: find . -type f ! -name sha256sums -exec sha256sum {} + > sha256sums

      # 发布策略:
      #   - tag 按北京日期自动生成(dev-YYYYMMDD),无需手动填写;定时/重跑都归入当天
      #   - 同一天重复运行(手动重跑/失败重试)先删旧 Release 和旧 tag 再重建,保证覆盖
      #   - --target GITHUB_SHA 把 Release 固定指向本次构建的 commit
      #   - prerelease 标记:每日构建属开发版,不与正式版本混淆
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          # release job 不在 matrix 内,取不到 matrix.target,型号名写死(与 build job 保持一致)
          TARGET: nokia-xg-040g-md
        run: |
          release_tag="dev-$(TZ=Asia/Shanghai date +%Y%m%d)"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$release_tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create "$release_tag" \
            release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PonWrt $release_tag ($TARGET)" \
            --prerelease \
            --generate-notes
